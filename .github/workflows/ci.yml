name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate hand-edited data
        run: python scripts/validate_data.py
      - name: Check static HTML surface
        run: python scripts/check_site.py
      - name: Compile Python scripts
        run: python -m compileall -q scripts
