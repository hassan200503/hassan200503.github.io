name: Site checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate hand-edited data
        run: python scripts/validate_data.py
      - name: Validate generated GitHub snapshot
        run: python scripts/validate_github_snapshot.py
      - name: Run snapshot fixture tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test webhook relay
        run: npm test --prefix worker
      - name: Verify generated pages
        run: python scripts/build_site.py --check
      - name: Check static HTML surface
        run: python scripts/check_site.py
      - name: Compile Python scripts
        run: python -m compileall -q scripts
